services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: knight
      POSTGRES_USER: knight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - knight-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knight -d knight']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    build: .
    command: ['pnpm', '--filter', '@knight/database', 'exec', 'drizzle-kit', 'migrate']
    environment:
      DATABASE_URL: postgres://knight:${POSTGRES_PASSWORD}@postgres:5432/knight
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build: .
    command: ['pnpm', '--filter', '@knight/bot', 'start']
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://knight:${POSTGRES_PASSWORD}@postgres:5432/knight
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: .
    command: ['pnpm', '--filter', '@knight/web', 'start']
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://knight:${POSTGRES_PASSWORD}@postgres:5432/knight
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ['pnpm', '--filter', '@knight/worker', 'start']
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://knight:${POSTGRES_PASSWORD}@postgres:5432/knight
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  knight-postgres:
